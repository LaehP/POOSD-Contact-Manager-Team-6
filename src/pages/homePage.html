<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home Page</title>
        <link rel="stylesheet" href="../assets/fonts.css">
        <link rel="stylesheet" href="../styles/home.css">
    </head>
    <body>
            <div class="container">
                <!--Search bar-->
                <header class="top-bar">
                <div class="search-wrapper">
                    <img src="../assets/search.png" alt="Search" class="search-icon" width="30" height="30">
                    <input type="search" class="search-box" placeholder="Search">
                    <button type="button" class="clear-btn" aria-label="Clear search">&times;</button>
                </div>
                <a href="editPage.html" class="add-btn" aria-label="Add contact">+</a>
                </header>

                <!--User Profile Banner-->
                <div class="profile-banner">
                <div class="profile-info">
                    <span class="star-icon">★</span>
                    <span class="user-name">Your Name</span>
                </div>
                <a href="contactPage.html" class="arrow-btn" aria-label="View profile">&gt;</a>
                </div>

                <!--Section Header-->
                <div class="section-header">
                <h2>Contacts</h2>
                </div>

                <!--Scrollable Contact List-->
                <div class="contacts-list">
                <div class="contact-item">
                    <span class="contact-name">First, Last</span>
                    <a href="contactPage.html" class="arrow-btn" aria-label="View contact">&gt;</a>
                </div>
                <div class="contact-item"></div>

</html>
