<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Edit Contact</title>
  <link rel="stylesheet" href="../assets/fonts.css">
  <link rel="stylesheet" href="../styles/edit.css">
</head>

<body>
  <div class="screen-card">
    <div class="header">
      <a class="back-button" href="contactPage.html" aria-label="Back to contact">Back</a>
      <button class="trash-button" id="deleteButton">
        <img src="../assets/Trash 2.png" alt="Delete" width="30" height="30">
      </button>
    </div>

    <div class="form-body">
      <div class="text-field">
        <label for="firstNameInput">Name:</label>
        <div class="two-column">
          <div class="inline-field">
            <input type="text" id="firstNameInput" placeholder="John">
          </div>
          <div class="inline-field">
            <input type="text" id="lastNameInput" placeholder="Doe">
          </div>
        </div>
      </div>

      <div class="text-field">
        <label for="numberInput">Phone Number:</label>
        <input type="text" id="numberInput" placeholder="(555) 123-4567">
      </div>

      <div class="text-field">
        <label for="emailInput">Email:</label>
        <input type="text" id="emailInput" placeholder="example@email.com">
      </div>

      <div>
        <div class="date-label">Date Created:</div>
        <div class="date-value" id="dateCreated">09/04/2026</div>
      </div>

      <div class="save-container">
        <button class="save-button" id="saveButton">Save</button>
      </div>

    </div>
  </div>
  <!-- <script src="../js/edit.js"></script> -->
</body>
</html>
