<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Individual Contact</title>
  <link rel="stylesheet" href="../assets/fonts.css">
  <link rel="stylesheet" href="../styles/edit.css">
</head>

<body>
  <div class="screen-card">
    <div class="header">
      <button class="back-button" id="backButton">^</button>
      <a class="trash-button" href="editPage.html" aria-label="Edit contact">
        <img src="../assets/Edit.png" alt="Edit" width="30" height="30">
      </a>
    </div>

    <div class="form-body">
      <div class="contact-name" id="contactName">Melinda Mai</div>

      <div class="text-field">
        <label for="numberInput">Phone Number</label>
        <input type="text" id="numberInput" placeholder="Phone Number" readonly>
      </div>

      <div class="text-field">
        <label for="emailInput">Email</label>
        <input type="text" id="emailInput" placeholder="Email" readonly>
      </div>

      <div>
        <div class="date-label">Date Created</div>
        <div class="date-value" id="dateCreated">09/04/2026</div>
      </div>

    </div>
  </div>
</body>
</html>
