<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Individual Contact</title>
  <link rel="stylesheet" href="../assets/fonts.css">
  <link rel="stylesheet" href="../styles/edit.css">
</head>

<body>
  <div class="screen-card">
    <div class="header">
      <button class="back-button" id="backButton">^</button>
      <a class="trash-button" href="editPage.html" aria-label="Edit contact">
        <img src="../assets/Edit.png" alt="Edit" width="30" height="30">
      </a>
    </div>

    <div class="form-body">
      <div class="contact-name" id="contactName">Melinda Mai</div>

      <div class="info-row">
        <span class="info-label">Phone Number:</span>
        <span class="info-value" id="numberInput">(555) 123-4567</span>
      </div>

      <div class="info-row email-row">
        <span class="info-label">Email:</span>
        <span class="info-value" id="emailInput">melinda@email.com</span>
      </div>

      <div class="info-row date-block">
        <span class="info-label">Date Created:</span>
        <span class="info-value" id="dateCreated">09/04/2026</span>
      </div>

    </div>
  </div>
</body>
</html>
