<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Contact App</title>
    
        <link rel="stylesheet" href="../styles/login.css">
        <link rel="stylesheet" href="../assets/fonts.css">
    </head>
    <body>

        <div class="white-container">
            <div class="header">
                <h2>Welcome!</h2>
            </div>

            <!-- Required user information input boxes -->
            <div class="text-input">
                <label for="login-email-box">Email</label>
                <input type="text" id="login-email-box" name="email" placeholder="example@email.com">
            </div>

            <div class="text-input">
                <label for="login-password-box">Password</label>
                <input type="password" id="login-password-box" name="password" placeholder="password">
            </div>

            <!-- Appears if a box is left blank or incorrect user credentials -->
            <p id="incorrect-login-alert">Incorrect username or password.</p>

            <button class="submit-button" onclick="loginValidation()">Sign In</button>
            <p class="page-link"><a href="signupPage.html">Create Account</a></p>

        </div>

        <script src="../js/login.js"></script>

    </body>
</html>
