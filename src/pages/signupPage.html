<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Contact App</title>
    
        <link rel="stylesheet" href="../styles/login.css">
        <link rel="stylesheet" href="../assets/fonts.css">
    </head>
    <body>

        <div class="white-container">
            <div class="header">
                <h2>Create your account</h2>
            </div>

            <div class="text-input">
                <label for="name-box">Name<span style="color: red;">*</span></label>
                <input type="text" id="name-box" name="name" placeholder="John Doe">
            </div>

            <div class="text-input">
                <label for="phoneNum-box">Phone Number<span style="color: red;">*</span></label>
                <input type="text" id="phoneNum-box" name="phoneNumber" placeholder="123-456-7890">
            </div>

            <div class="text-input">
                <label for="signup-email-box">Email<span style="color: red;">*</span></label>
                <input type="text" id="signup-email-box" name="email" placeholder="example@email.com">
            </div>

            <div class="text-input">
                <label for="signup-password-box">Password<span style="color: red;">*</span></label>
                <input type="text" id="signup-password-box" name="password" placeholder="password">
            </div>

            <p id="signup-alert">Fill out all required fields.</p>


            <button class="submit-button" onclick="createAccount()">Sign Up</button>
            <p class="page-link"><a href="loginPage.html">Back to Login</a></p>

        </div>

        <script src="../js/signup.js"></script>

    </body>
</html>
